{% extends "base.html" %}

{% block title %}Perfil - MAC Calendar{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Header Section -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="text-gradient mb-1">Meu Perfil</h1>
                    <p class="text-muted mb-0">Gerencie suas informações pessoais</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary" onclick="toggleEditMode()">
                        <i class="fas fa-edit me-1"></i>Editar
                    </button>
                    <button class="btn btn-primary" id="saveBtn" style="display: none;" onclick="saveProfile()">
                        <i class="fas fa-save me-1"></i>Salvar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Profile Card -->
        <div class="col-lg-4">
            <div class="card glass-card h-100">
                <div class="card-body text-center">
                    <div class="profile-avatar mb-3">
                        <img src="https://ui-avatars.com/api/?name=User&size=120&background=007AFF&color=fff" 
                             alt="Avatar" class="rounded-circle" id="userAvatar">
                        <div class="avatar-overlay" id="avatarOverlay" style="display: none;">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    
                    <h4 class="mb-1" id="displayName">Usuário</h4>
                    <p class="text-muted mb-3" id="displayRole">Administrador</p>
                    
                    <div class="profile-stats">
                        <div class="row g-3">
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number">25</div>
                                    <div class="stat-label">Eventos</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number">12</div>
                                    <div class="stat-label">Equipes</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number">8</div>
                                    <div class="stat-label">Docs</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Form -->
        <div class="col-lg-8">
            <div class="card glass-card">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="fas fa-user me-2"></i>Informações Pessoais
                    </h5>
                </div>
                <div class="card-body">
                    <form id="profileForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label">Nome Completo</label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="Usuário Admin" disabled>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="admin@mac.com" disabled>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Telefone</label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="(11) 99999-9999" disabled>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="role" class="form-label">Cargo</label>
                                <select class="form-select" id="role" name="role" disabled>
                                    <option value="admin" selected>Administrador</option>
                                    <option value="manager">Gerente</option>
                                    <option value="employee">Funcionário</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="department" class="form-label">Departamento</label>
                                <input type="text" class="form-control" id="department" name="department" 
                                       value="Administração" disabled>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="startDate" class="form-label">Data de Início</label>
                                <input type="date" class="form-control" id="startDate" name="startDate" 
                                       value="2024-01-01" disabled>
                            </div>
                            
                            <div class="col-12">
                                <label for="bio" class="form-label">Biografia</label>
                                <textarea class="form-control" id="bio" name="bio" rows="3" 
                                          disabled>Administrador do sistema MAC Calendar com experiência em gestão de restaurantes.</textarea>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Password Change Card -->
            <div class="card glass-card mt-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">
                        <i class="fas fa-lock me-2"></i>Alterar Senha
                    </h5>
                </div>
                <div class="card-body">
                    <form id="passwordForm">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label for="currentPassword" class="form-label">Senha Atual</label>
                                <input type="password" class="form-control" id="currentPassword" 
                                       name="currentPassword" required>
                            </div>
                            
                            <div class="col-md-4">
                                <label for="newPassword" class="form-label">Nova Senha</label>
                                <input type="password" class="form-control" id="newPassword" 
                                       name="newPassword" required>
                            </div>
                            
                            <div class="col-md-4">
                                <label for="confirmPassword" class="form-label">Confirmar Senha</label>
                                <input type="password" class="form-control" id="confirmPassword" 
                                       name="confirmPassword" required>
                            </div>
                            
                            <div class="col-12">
                                <button type="submit" class="btn btn-warning">
                                    <i class="fas fa-key me-1"></i>Alterar Senha
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let editMode = false;

function toggleEditMode() {
    editMode = !editMode;
    const inputs = document.querySelectorAll('#profileForm input, #profileForm select, #profileForm textarea');
    const saveBtn = document.getElementById('saveBtn');
    const editBtn = document.querySelector('[onclick="toggleEditMode()"]');
    
    inputs.forEach(input => {
        if (input.id !== 'email') { // Email não pode ser editado
            input.disabled = !editMode;
        }
    });
    
    if (editMode) {
        saveBtn.style.display = 'inline-block';
        editBtn.innerHTML = '<i class="fas fa-times me-1"></i>Cancelar';
        editBtn.className = 'btn btn-outline-secondary';
    } else {
        saveBtn.style.display = 'none';
        editBtn.innerHTML = '<i class="fas fa-edit me-1"></i>Editar';
        editBtn.className = 'btn btn-outline-primary';
    }
}

async function saveProfile() {
    const formData = new FormData(document.getElementById('profileForm'));
    const data = Object.fromEntries(formData);
    
    try {
        const response = await Utils.makeRequest('/profile', {
            method: 'PUT',
            body: JSON.stringify(data)
        });
        
        Utils.showToast('Perfil atualizado com sucesso!', 'success');
        toggleEditMode();
        
        // Atualizar dados na tela
        document.getElementById('displayName').textContent = data.name;
        
    } catch (error) {
        Utils.showAlert('Erro ao salvar perfil: ' + error.message, 'error');
    }
}

// Form de senha
document.getElementById('passwordForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);
    
    if (data.newPassword !== data.confirmPassword) {
        Utils.showAlert('As senhas não coincidem', 'error');
        return;
    }
    
    try {
        await Utils.makeRequest('/profile/password', {
            method: 'POST',
            body: JSON.stringify({
                current_password: data.currentPassword,
                new_password: data.newPassword
            })
        });
        
        Utils.showToast('Senha alterada com sucesso!', 'success');
        this.reset();
        
    } catch (error) {
        Utils.showAlert('Erro ao alterar senha: ' + error.message, 'error');
    }
});

// Carregar dados do usuário
document.addEventListener('DOMContentLoaded', function() {
    const user = Utils.getCurrentUser();
    if (user) {
        document.getElementById('displayName').textContent = user.name || 'Usuário';
        document.getElementById('displayRole').textContent = user.role || 'Usuário';
        document.getElementById('name').value = user.name || '';
        document.getElementById('email').value = user.email || '';
        
        // Atualizar avatar
        const avatar = document.getElementById('userAvatar');
        avatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&size=120&background=007AFF&color=fff`;
    }
});
</script>
{% endblock %}
