server {
    server_name calendar.thecarv.com;

    root  /home/Thecarv/web/calendar.thecarv.com/public_html;
    index index.html;

    access_log  /var/log/nginx/domains/calendar.thecarv.com.log combined;
    error_log   /var/log/nginx/domains/calendar.thecarv.com.error.log error;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location /static/ {
        alias /home/Thecarv/web/calendar.thecarv.com/collected_static/;
        expires 30d;
        access_log off;
    }

    location ^~ /media/tickets/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /media/ {
        alias /home/Thecarv/web/calendar.thecarv.com/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    listen 161.97.87.17:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/calendar.thecarv.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/calendar.thecarv.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = calendar.thecarv.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      161.97.87.17:80;
    server_name calendar.thecarv.com;
    return 404; # managed by Certbot


}
