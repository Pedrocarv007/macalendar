<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .splash {
      text-align: center;
      animation: fadeUp 0.7s ease forwards;
    }

    .logo-ring {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #FFBC0D;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 32px rgba(45, 45, 45, 0.16);
      animation: fadeUp 0.7s ease 0.1s both;
    }

    .logo-ring svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #2D2D2D;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-name {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #2D2D2D;
      animation: fadeUp 0.7s ease 0.2s both;
    }

    .brand-name span {
      color: #2D2D2D;
    }

    .sub-name {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #737373;
      text-transform: uppercase;
      margin-top: 6px;
      animation: fadeUp 0.7s ease 0.3s both;
    }

    .divider {
      width: 36px;
      height: 2px;
      background: #FFBC0D;
      border-radius: 2px;
      margin: 20px auto;
      animation: fadeUp 0.7s ease 0.4s both;
    }

    .loader {
      display: flex;
      gap: 7px;
      justify-content: center;
      margin-top: 4px;
      animation: fadeUp 0.6s ease 0.5s both;
    }

    .loader span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2D2D2D;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; background: #FFBC0D; }
    .loader span:nth-child(3) { animation-delay: 0.4s; background: #2D2D2D; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
      40%            { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-ring">
      <!-- Calendar icon -->
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="3"/>
        <path d="M3 9h18"/>
        <path d="M8 2v4M16 2v4"/>
        <path d="M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/>
      </svg>
    </div>
    <h1 class="brand-name"><span>MC</span></h1>
    <p class="sub-name">TheCarv · Portal de Gestão</p>
    <div class="divider"></div>
    <div class="loader">
      <span></span><span></span><span></span>
    </div>
  </div>

  <script>
    setTimeout(() => { window.location.href = '/calendar'; }, 2500);
  </script>
</body>
</html>
