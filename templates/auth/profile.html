{% extends "base.html" %}
{% block title %}Perfil{% endblock %}
{% block page_title %}Meu Perfil{% endblock %}

{% block content %}
<div x-data="profilePage()" x-init="init()" style="max-width:600px;margin:0 auto">

  <!-- Perfil card -->
  <div class="card" style="margin-bottom:16px">

    <!-- Avatar + info -->
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
      <div style="position:relative">
        <img :src="user.photo_url" class="avatar avatar-xl" style="border:2px solid var(--gold-light)">
        <label style="position:absolute;bottom:0;right:0;width:26px;height:26px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--surface)">
          <svg style="width:12px;height:12px;color:#fff" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <input type="file" accept="image/*" style="display:none" @change="uploadPhoto($event)">
        </label>
      </div>
      <div>
        <p style="font-size:16px;font-weight:600;color:var(--text-primary)" x-text="user.name"></p>
        <p class="text-sm text-muted" style="margin-top:2px" x-text="user.get_role_display || user.role"></p>
        <p class="text-xs text-muted" x-text="user.email"></p>
      </div>
    </div>

    <!-- Campos editáveis -->
    <div class="grid-2" style="margin-bottom:14px">
      <div class="form-group">
        <label class="form-label">Nome</label>
        <input x-model="form.name" type="text" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Telefone</label>
        <input x-model="form.phone" type="tel" class="form-input">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Morada</label>
      <input x-model="form.address" type="text" class="form-input">
    </div>
    <div class="form-group">
      <label class="form-label">Data de Nascimento</label>
      <input x-model="form.birth_date" type="date" class="form-input">
    </div>

    <button @click="save()" class="btn btn-primary" style="margin-top:8px">Guardar Alterações</button>
  </div>

  <!-- Preferências -->
  <div class="card">
    <div class="card-title">Preferências</div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
        <span class="text-sm" style="color:var(--text-primary)">Modo Escuro</span>
        <label class="toggle">
          <input type="checkbox" x-model="settings.dark_mode" @change="saveSettings()">
          <span class="toggle-slider"></span>
        </label>
      </label>
      <div class="divider" style="margin:0"></div>
      <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
        <span class="text-sm" style="color:var(--text-primary)">Notificações por Email</span>
        <label class="toggle">
          <input type="checkbox" x-model="settings.email_notifications" @change="saveSettings()">
          <span class="toggle-slider"></span>
        </label>
      </label>
    </div>
  </div>

</div>
<script src="/static/js/modules/profile.js"></script>
{% endblock %}
