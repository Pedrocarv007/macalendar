{% extends "base.html" %}
{% block title %}Documentos{% endblock %}
{% block page_title %}Documentos{% endblock %}

{% block content %}
<div x-data="documentsPage()" x-init="init()">

  <!-- Toolbar -->
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px">
    <input x-model="search" @input.debounce.300ms="load()" type="text"
      placeholder="Pesquisar..." class="form-input" style="width:200px">
    <select x-model="typeFilter" @change="load()" class="form-input" style="width:170px">
      <option value="">Todos os tipos</option>
      <option value="birthday">Aniversário</option>
      <option value="welcome">Boas-Vindas</option>
      <option value="employee_month">Func. do Mês</option>
      <option value="memo">Memorando</option>
      <option value="photo">Foto</option>
    </select>
    <div style="display:flex;gap:8px;margin-left:auto">
      <button @click="openGenerator()" class="btn btn-secondary">Gerar Cartão</button>
      <button @click="openUpload()" class="btn btn-primary">+ Upload</button>
    </div>
  </div>

  <!-- Grid -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">
    <template x-for="doc in documents" :key="doc.id">
      <div class="card" style="transition:box-shadow 150ms">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
          <div style="width:38px;height:38px;border-radius:9px;background:var(--gold-light);display:flex;align-items:center;justify-content:center">
            <svg style="width:18px;height:18px;color:var(--gold)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <span class="badge badge-gray text-xs" x-text="doc.document_type"></span>
        </div>
        <p style="font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="doc.title"></p>
        <p class="text-xs text-muted" style="margin-top:3px" x-text="doc.file_size_display || '—'"></p>
        <div style="display:flex;gap:10px;margin-top:12px">
          <a :href="`/api/documents/${doc.id}/download`" class="btn btn-ghost btn-sm" style="color:var(--gold);padding:0">Download</a>
          <button @click="deleteDoc(doc.id)" class="btn btn-ghost btn-sm" style="color:#ef4444;padding:0;margin-left:auto">Apagar</button>
        </div>
      </div>
    </template>
    <div x-show="documents.length === 0" class="empty-state" style="grid-column:1/-1">Sem documentos.</div>
  </div>

  <!-- Upload Modal -->
  <div x-show="showUpload" x-transition class="mac-modal-overlay">
    <div class="mac-modal">
      <div class="mac-modal-title">Carregar Documento</div>
      <div class="form-group">
        <label class="form-label">Título</label>
        <input x-model="uploadForm.title" type="text" placeholder="Título" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select x-model="uploadForm.document_type" class="form-input">
          <option value="memo">Memorando</option>
          <option value="photo">Foto</option>
          <option value="certificate">Certificado</option>
          <option value="other">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Ficheiro</label>
        <input type="file" @change="uploadForm.file = $event.target.files[0]" class="form-input" style="height:auto;padding:8px 12px">
      </div>
      <div class="mac-modal-footer">
        <button @click="upload()" class="btn btn-primary" style="flex:1">Carregar</button>
        <button @click="showUpload=false" class="btn btn-secondary" style="flex:1">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Generator Modal -->
  <div x-show="showGenerator" x-transition class="mac-modal-overlay">
    <div class="mac-modal" style="max-width:520px">
      <div class="mac-modal-title">Gerar Cartão</div>

      <!-- Template type -->
      <div class="form-group">
        <label class="form-label">Tipo de Cartão</label>
        <div style="display:flex;gap:8px">
          <template x-for="t in ['birthday','welcome','employee_month']" :key="t">
            <button @click="genForm.template = t" class="btn btn-sm" style="flex:1"
              :class="genForm.template === t ? 'btn-primary' : 'btn-secondary'"
              x-text="templateLabel(t)"></button>
          </template>
        </div>
      </div>

      <!-- Person type -->
      <div class="form-group">
        <label class="form-label">Para quem</label>
        <div style="display:flex;gap:8px">
          <button @click="genForm.person_type='employee'; genForm.worker_id=''" class="btn btn-sm" style="flex:1"
            :class="genForm.person_type==='employee' ? 'btn-primary' : 'btn-secondary'">Funcionário</button>
          <button @click="genForm.person_type='worker'; genForm.employee_id=''" class="btn btn-sm" style="flex:1"
            :class="genForm.person_type==='worker' ? 'btn-primary' : 'btn-secondary'">Colaborador</button>
        </div>
      </div>

      <!-- Employee select -->
      <div class="form-group" x-show="genForm.person_type === 'employee'">
        <label class="form-label">Funcionário</label>
        <select x-model="genForm.employee_id" class="form-input">
          <option value="">Seleccionar funcionário...</option>
          <template x-for="e in employees" :key="e.id">
            <option :value="e.id" x-text="e.name"></option>
          </template>
        </select>
      </div>

      <!-- Worker select -->
      <div class="form-group" x-show="genForm.person_type === 'worker'">
        <label class="form-label">Colaborador</label>
        <select x-model="genForm.worker_id" class="form-input">
          <option value="">Seleccionar colaborador...</option>
          <template x-for="w in workers" :key="w.id">
            <option :value="w.id" x-text="w.name"></option>
          </template>
        </select>
      </div>

      <!-- Restaurant -->
      <div class="form-group">
        <label class="form-label">Restaurante</label>
        <select x-model="genForm.restaurant_id" class="form-input">
          <option value="">Restaurante do utilizador</option>
          <template x-for="r in restaurants" :key="r.id">
            <option :value="r.id" x-text="r.name"></option>
          </template>
        </select>
      </div>

      <!-- Month/year for employee_month -->
      <div class="form-group" x-show="genForm.template === 'employee_month'">
        <label class="form-label">Mês / Ano</label>
        <input x-model="genForm.message" type="text" placeholder="Ex: Março 2026" class="form-input">
      </div>

      <div class="mac-modal-footer">
        <button @click="generate()" class="btn btn-primary" style="flex:1">Gerar</button>
        <button @click="showGenerator=false" class="btn btn-secondary" style="flex:1">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div x-show="showPreview" x-transition class="mac-modal-overlay" @click.self="showPreview=false">
    <div class="mac-modal" style="max-width:700px;padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:14px;font-weight:600;color:var(--text-primary)">Pré-visualização</span>
        <button @click="showPreview=false" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <img :src="previewUrl" style="width:100%;border-radius:10px;object-fit:contain;max-height:70vh">
      <div style="margin-top:12px;text-align:right">
        <a :href="previewUrl" download class="btn btn-primary">Download</a>
      </div>
    </div>
  </div>

</div>
<script src="/static/js/modules/documents.js"></script>
{% endblock %}
