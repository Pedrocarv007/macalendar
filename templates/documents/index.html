{% extends "base.html" %}
{% block title %}Documentos{% endblock %}
{% block page_title %}Documentos{% endblock %}

{% block content %}
<div x-data="documentsPage()" x-init="init()">

  <div class="docs-shell">
  <!-- Toolbar -->
  <div class="docs-toolbar" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px">
    <input x-model="search" @input.debounce.300ms="load()" type="text"
      placeholder="Pesquisar..." class="form-input" style="width:200px">
    <select x-model="typeFilter" @change="onTypeFilterChange()" class="form-input" style="width:170px">
      <option value="">Todos os tipos</option>
      <option value="birthday">Aniversário</option>
      <option value="welcome">Boas-Vindas</option>
      <option value="employee_month">Func. do Mês</option>
      <option value="memo">Memorando</option>
      <option value="photo">Foto</option>
    </select>
    <div style="display:flex;gap:8px;margin-left:auto">
      <button @click="openGenerator()" class="btn btn-secondary">Gerar Cartão</button>
      <button @click="openUpload()" class="btn btn-primary">+ Upload</button>
    </div>
  </div>

    <div class="docs-folder-grid">
      <template x-for="folder in folders" :key="folder.key">
        <button type="button" class="docs-folder-card" @click="selectFolder(folder.key)"
          :class="activeFolder === folder.key ? 'is-active' : ''">
          <div class="docs-folder-top">
            <div class="docs-folder-icon" :class="folder.accentClass" x-html="folder.icon"></div>
            <span class="badge" :class="folder.badgeClass" x-text="folderCount(folder.key) + ' itens'"></span>
          </div>
          <div>
            <h3 class="docs-folder-title" x-text="folder.label"></h3>
            <p class="docs-folder-text" x-text="folder.description"></p>
          </div>
        </button>
      </template>
    </div>

  <div class="docs-section-head">
    <div>
      <p class="docs-section-kicker">Conteúdo</p>
      <h3 class="docs-section-title" x-text="activeCategoryLabel()"></h3>
    </div>
    <p class="docs-section-count" x-text="filteredDocuments().length + ' resultado(s)'"></p>
  </div>

  <!-- Grid -->
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px">
    <template x-for="doc in filteredDocuments()" :key="doc.id">
      <div class="card" style="transition:box-shadow 150ms">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px">
          <div style="width:38px;height:38px;border-radius:9px;background:var(--gold-light);display:flex;align-items:center;justify-content:center">
            <svg style="width:18px;height:18px;color:var(--gold-dark)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <span class="badge badge-gray text-xs" x-text="doc.document_type"></span>
        </div>
        <p style="font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="doc.title"></p>
        <p class="text-xs text-muted" style="margin-top:3px" x-text="doc.file_size_display || '—'"></p>
        <div style="display:flex;gap:10px;margin-top:12px">
          <a :href="`/api/documents/${doc.id}/download`" class="btn btn-ghost btn-sm" style="color:var(--gold-dark);padding:0">Download</a>
          <button @click="deleteDoc(doc.id)" class="btn btn-ghost btn-sm" style="color:#ef4444;padding:0;margin-left:auto">Apagar</button>
        </div>
      </div>
    </template>
    <div x-show="filteredDocuments().length === 0" class="empty-state" style="grid-column:1/-1">Sem documentos nesta categoria.</div>
  </div>

  </div>

  <!-- Upload Modal -->
  <div x-show="showUpload" x-transition class="mac-modal-overlay">
    <div class="mac-modal">
      <div class="mac-modal-title">Carregar Documento</div>
      <div class="form-group">
        <label class="form-label">Título</label>
        <input x-model="uploadForm.title" type="text" placeholder="Título" class="form-input">
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select x-model="uploadForm.document_type" class="form-input">
          <option value="memo">Memorando</option>
          <option value="photo">Foto</option>
          <option value="certificate">Certificado</option>
          <option value="other">Outro</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Ficheiro</label>
        <input type="file" @change="uploadForm.file = $event.target.files[0]" class="form-input" style="height:auto;padding:8px 12px">
      </div>
      <div class="mac-modal-footer">
        <button @click="upload()" class="btn btn-primary" style="flex:1">Carregar</button>
        <button @click="showUpload=false" class="btn btn-secondary" style="flex:1">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Generator Modal -->
  <div x-show="showGenerator" x-transition class="mac-modal-overlay">
    <div class="mac-modal" style="max-width:520px">
      <div class="mac-modal-title">Gerar Cartão</div>

      <!-- Template type -->
      <div class="form-group">
        <label class="form-label">Tipo de Cartão</label>
        <div style="display:flex;gap:8px">
          <template x-for="t in ['birthday','welcome','employee_month']" :key="t">
            <button @click="genForm.template = t" class="btn btn-sm" style="flex:1"
              :class="genForm.template === t ? 'btn-primary' : 'btn-secondary'"
              x-text="templateLabel(t)"></button>
          </template>
        </div>
      </div>

      <!-- Person type -->
      <div class="form-group">
        <label class="form-label">Para quem</label>
        <div style="display:flex;gap:8px">
          <button @click="switchPersonType('employee')" class="btn btn-sm" style="flex:1"
            :class="genForm.person_type==='employee' ? 'btn-primary' : 'btn-secondary'">Funcionário</button>
          <button @click="switchPersonType('worker')" class="btn btn-sm" style="flex:1"
            :class="genForm.person_type==='worker' ? 'btn-primary' : 'btn-secondary'">Colaborador</button>
        </div>
      </div>

      <!-- Person picker button -->
      <div class="form-group">
        <label class="form-label" x-text="genForm.person_type === 'employee' ? 'Funcionário' : 'Colaborador'"></label>
        <button @click="openPicker()" class="btn btn-secondary"
          style="width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 12px">
          <template x-if="selectedPerson && selectedPerson.photo_url">
            <img :src="selectedPerson.photo_url"
              style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0">
          </template>
          <template x-if="!selectedPerson || !selectedPerson.photo_url">
            <span style="width:36px;height:36px;border-radius:50%;background:var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center">
              <i class="fas fa-user" style="font-size:14px;color:var(--text-muted)"></i>
            </span>
          </template>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
            x-text="selectedPerson ? selectedPerson.name + (selectedPerson.restaurant_name ? ' — ' + selectedPerson.restaurant_name : '') : 'Selecionar pessoa...'">
          </span>
        </button>
      </div>

      <!-- Restaurant -->
      <div class="form-group">
        <label class="form-label">Restaurante</label>
        <select x-model="genForm.restaurant_id" class="form-input">
          <option value="">Restaurante do utilizador</option>
          <template x-for="r in restaurants" :key="r.id">
            <option :value="r.id" x-text="r.name"></option>
          </template>
        </select>
      </div>

      <!-- Month/year for employee_month -->
      <div class="form-group" x-show="genForm.template === 'employee_month'">
        <label class="form-label">Mês / Ano</label>
        <input x-model="genForm.message" type="text" placeholder="Ex: Março 2026" class="form-input">
      </div>

      <div class="mac-modal-footer">
        <button @click="generate()" class="btn btn-primary" style="flex:1">Gerar</button>
        <button @click="showGenerator=false" class="btn btn-secondary" style="flex:1">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Person Picker Modal -->
  <div x-show="showPicker" x-transition class="mac-modal-overlay" @click.self="showPicker=false">
    <div class="mac-modal" style="max-width:640px;max-height:80vh;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:15px;font-weight:600;color:var(--text-primary)"
          x-text="genForm.person_type === 'employee' ? 'Selecionar Funcionário' : 'Selecionar Colaborador'"></span>
        <button @click="showPicker=false" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <!-- Search -->
      <input x-model="pickerSearch" type="text" placeholder="Pesquisar por nome ou restaurante..."
        class="form-input" style="margin-bottom:14px">
      <!-- Grid -->
      <div style="overflow-y:auto;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding-right:4px">
        <template x-for="person in peopleList()" :key="person.id">
          <button @click="pickPerson(person)"
            style="background:var(--card-bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:border-color 150ms,box-shadow 150ms"
            :style="(selectedPerson && selectedPerson.id === person.id) ? 'border-color:var(--gold);box-shadow:0 0 0 2px rgba(0,166,81,0.2)' : ''"
            @mouseenter="$el.style.borderColor='var(--gold)'" @mouseleave="$el.style.borderColor=(selectedPerson && selectedPerson.id===person.id)?'var(--gold)':'var(--border)'">
            <img :src="person.photo_url" :alt="person.name"
              style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border)">
            <span style="font-size:12px;font-weight:600;color:var(--text-primary);text-align:center;line-height:1.3;word-break:break-word"
              x-text="person.name"></span>
            <span style="font-size:11px;color:var(--text-muted);text-align:center"
              x-text="person.restaurant_name || '—'"></span>
          </button>
        </template>
        <div x-show="peopleList().length === 0" class="empty-state"
          style="grid-column:1/-1;padding:24px">Nenhuma pessoa encontrada.</div>
      </div>
    </div>
  </div>

  <!-- Preview Modal -->
  <div x-show="showPreview" x-transition class="mac-modal-overlay" @click.self="showPreview=false">
    <div class="mac-modal" style="max-width:700px;padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span style="font-size:14px;font-weight:600;color:var(--text-primary)">Pré-visualização</span>
        <button @click="showPreview=false" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <img :src="previewUrl" style="width:100%;border-radius:10px;object-fit:contain;max-height:70vh">
      <div style="margin-top:12px;text-align:right">
        <a :href="previewUrl" download class="btn btn-primary">Download</a>
      </div>
    </div>
  </div>

</div>
<script src="/static/js/modules/documents.js?v=3"></script>
{% endblock %}
